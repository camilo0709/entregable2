services:
  - type: web
    name: tb-segmentacion-dash
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --workers 1 --threads 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TB_WEIGHTS_URL
        value: https://github.com/camilo0709/entregable3/releases/download/pesos-onnx-v1
