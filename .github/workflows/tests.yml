name: tests
on:
  push:
    branches: [entregable3, main]
    paths: ["codigo/e3/**"]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install pytest numpy
      - run: pytest codigo/e3/tests -q
